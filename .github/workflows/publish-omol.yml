name: publish-omol

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version suffix after base (e.g. 4.19.3-omol.YYYYMMDDHHMM). Leave empty to auto-generate."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: i18n/consolidate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Sync with upstream dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/code-yeongyu/oh-my-openagent.git || true
          git fetch upstream dev
          # Merge upstream dev, auto-resolving conflicts in favor of fork changes (-X ours).
          # Fork-specific fields (name/bin/scripts/version) must survive; upstream fixes land
          # in non-conflicting files. package.json dependency fields are merged explicitly below.
          git merge -X ours upstream/dev --no-edit
          # Merge dependency/workspace fields from upstream package.json into ours (union).
          node -e "
            const fs = require('fs')
            const cp = require('child_process')
            const upstream = JSON.parse(cp.execSync('git show upstream/dev:package.json').toString())
            const cur = JSON.parse(fs.readFileSync('package.json'))
            const union = (a, b) => {
              if (Array.isArray(a) || Array.isArray(b)) return [...new Set([...(a || []), ...(b || [])])]
              return { ...(a || {}), ...(b || {}) }
            }
            for (const k of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'workspaces']) {
              cur[k] = union(upstream[k], cur[k])
            }
            fs.writeFileSync('package.json', JSON.stringify(cur, null, 2))
          "
          git add package.json
          git diff --cached --quiet || git commit -m "chore(omol): merge upstream dependencies"
          echo "Synced with upstream dev"

      - name: Build plugin
        run: |
          bun build packages/omo-opencode/src/index.ts --outdir dist --target bun --format esm --external zod
          bun build packages/omo-opencode/src/cli/index.ts --outdir dist/cli --target bun --format esm

      - name: Compile Windows binary
        run: bun build packages/omo-opencode/src/cli/index.ts --compile --target=bun-windows-x64 --outfile bin/omol.exe

      - name: Set version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Base version comes from upstream dev (always ahead of the fork), not from
            # the merged package.json which keeps the fork's own (stale) version field.
            BASE=$(git show upstream/dev:package.json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))" | sed 's/-.*//')
            TS=$(date -u +%Y%m%d%H%M)
            VERSION="${BASE}-omol.${TS}"
          fi
          node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2))"
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --ignore-scripts --tag latest --registry https://registry.npmjs.org

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "v${{ env.VERSION }}" --title "v${{ env.VERSION }}" --notes "Auto release ${{ env.VERSION }}" || true
