name: publish-omol

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version suffix after base (e.g. 4.19.3-omol.YYYYMMDDHHMM). Leave empty to auto-generate."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: i18n/consolidate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Sync with upstream dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/code-yeongyu/oh-my-openagent.git || true
          git fetch upstream dev
          # Check if behind
          BEHIND=$(git rev-list --count HEAD..upstream/dev || echo "0")
          if [ "$BEHIND" -gt 0 ]; then
            echo "Behind upstream by $BEHIND commits, rebasing..."
            git rebase --onto upstream/dev $(git merge-base HEAD upstream/dev) HEAD
          else
            echo "Up to date with upstream"
          fi

      - name: Build plugin
        run: |
          bun build packages/omo-opencode/src/index.ts --outdir dist --target bun --format esm --external zod
          bun build packages/omo-opencode/src/cli/index.ts --outdir dist/cli --target bun --format esm

      - name: Compile Windows binary
        run: bun build packages/omo-opencode/src/cli/index.ts --compile --target=bun-windows-x64 --outfile bin/omol.exe

      - name: Set version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            BASE=$(node -p "require('./package.json').version" | sed 's/-.*//')
            TS=$(date -u +%Y%m%d%H%M)
            VERSION="${BASE}-omol.${TS}"
          fi
          node -e "const p=require('./package.json'); p.version='$VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2))"
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --ignore-scripts --tag latest --registry https://registry.npmjs.org

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "v${{ env.VERSION }}" --title "v${{ env.VERSION }}" --notes "Auto release ${{ env.VERSION }}" || true
